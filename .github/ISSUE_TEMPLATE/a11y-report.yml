name: ♿ Accessibility Barrier
description: Report an issue that prevents users from fully accessing or interacting with the project.
title: "[Barrier]: <title>"
labels: ["accessibility", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping us make this project more inclusive! Please provide as much context as possible so we can reproduce and fix the barrier.

  - type: dropdown
    id: submitter
    attributes:
      label: Submitter
      description: Who is submitting this report?
      options:
        - Student
        - Faculty
        - Advisor
        - Dean
        - OAC
        - Other staff
    validations:
      required: true

  - type: textarea
    id: barrier-description
    attributes:
      label: Description of the Barrier
      description: What is the obstacle, and how does it impact the user experience?
      placeholder: E.g., The main navigation menu cannot be opened using only a keyboard...
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Explain how a developer or tester can replicate this accessibility issue.
      placeholder: |
        1. Navigate to the homepage.
        2. Press 'Tab' until reaching the profile dropdown.
        3. Press 'Enter' or 'Space' to expand it.
        4. Observe that focus jumps to the bottom of the page instead of into the menu.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected & Accessible Behavior
      description: What should happen to ensure compliance and a good user experience?
      placeholder: E.g., When the dropdown expands, keyboard focus should trap inside the menu elements...
    validations:
      required: true

  - type: input
    id: page-url
    attributes:
      label: Affected URL / Screen
      description: Where exactly does this issue occur?
      placeholder: e.g., https://example.com or "On the login modal"
    validations:
      required: true

  - type: checkboxes
    id: assistive-tech
    attributes:
      label: Assistive Technology / Tools Used
      description: Select all tools involved in finding or verifying this issue.
      options:
        - label: Keyboard Navigation Only
        - label: Screen Reader (NVDA, JAWS, VoiceOver, TalkBack)
        - label: Screen Magnification / Zoom (e.g., 200%+, ZoomText)
        - label: Voice Control / Speech Recognition
        - label: Automated Testing Tool (Axe, Lighthouse, WAVE)
        - label: High Contrast Mode / Color Filters

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Please specify your Operating System, Browser, and Screen Reader if applicable.
      placeholder: e.g., Windows 11, Chrome v120, NVDA v2023.3
    validations:
      required: false

  - type: dropdown
    id: wcag-impact
    attributes:
      label: WCAG Success Criteria / Impact (If known)
      description: If you know which WCAG guideline this relates to or how severely it blocks access, select it here.
      options:
        - ⚠️ Low (Annoyance / minor workaround available)
        - 🛑 Medium (Significant barrier / difficult workaround)
        - 🚨 High / Critical (Complete blocker / cannot complete the task)
        - ℹ️ WCAG 2.1 - 2.1.1 Keyboard (Level A)
        - ℹ️ WCAG 2.1 - 1.4.3 Contrast (Minimum) (Level AA)
        - ℹ️ WCAG 2.1 - 4.1.2 Name, Role, Value (Level A)
        - ℹ️ I don't know / Not sure

  - type: textarea
    id: visual-evidence
    attributes:
      label: Screenshots or Video
      description: Drag and drop or paste any images, GIFs, or code snippets that illustrate the issue.
      placeholder: Paste images here...
    validations:
      required: false
