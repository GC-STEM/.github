name: 💻 Environment Setup / Tooling Blocker
description: Report an issue with setup scripts, local configurations, or IDE installation tools.
title: "[Setup Blocker]: "
labels: ["environment-issue", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### Important Notice
        Use this template **only** if you are experiencing technical difficulties with repository scripts, installation tools, or setting up your local environment.
        * For general questions about assignment logic, code debugging, or grades, please post in your course LMS.

  - type: dropdown
    id: environment
    attributes:
      label: Operating System
      description: Which operating system are you using on your computer?
      options:
        - Windows
        - macOS
        - Linux
        - GitHub Codespaces / Cloud Environment
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what script you ran and the exact error you received.
      placeholder: E.g., I ran the install script for the course IDE and received an error saying my OS version isn't compatible...
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: What commands did you type or what actions did you take leading up to the error?
      placeholder: |
        1. Cloned the repository
        2. Opened Terminal/PowerShell
        3. Executed script...
    validations:
      required: true

  - type: textarea
    id: logs-evidence
    attributes:
      label: Log Files, Screenshots, or Error Output
      description: Drag and drop log files (e.g., .log files generated by the script) or paste terminal error messages here.
      placeholder: Paste error output or upload your install log file...
    validations:
      required: true

  - type: checkboxes
    id: scope-verification
    attributes:
      label: Scoping Verification
      options:
        - label: I understand that this issue is strictly for repository setup/tooling issues and that general homework/course questions must go through the LMS.
          required: true
