name: Report an accessibility barrier
description: Report repository material or an interaction that is difficult or impossible to use.
title: "[Accessibility] "
body:
  - type: markdown
    attributes:
      value: |
        A brief description is enough to start. You do not need to disclose a disability or diagnosis.

        Public reports can be read by anyone. Do not include medical information, accommodation documents, grades, or other private information.

        For private reporting or accommodation support, use [SNHU Accessibility Services](https://www.snhu.edu/about-us/accessibility). If this barrier blocks required coursework, also contact your instructor privately through Brightspace.

  - type: textarea
    id: location
    attributes:
      label: Where did the barrier occur?
      description: Identify the page, file, tool, or activity involved.
      placeholder: Page, file, tool, or activity...
    validations:
      required: true

  - type: textarea
    id: barrier
    attributes:
      label: What made it difficult or impossible to use?
      description: Describe what you were trying to do and what prevented or hindered it.
      placeholder: I was trying to... The barrier was...
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: How does this affect your work?
      description: Optional. Tell us whether it blocks a required activity and whether you have found a usable alternative.
    validations:
      required: false

  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Optional. Include relevant browser, operating system, assistive technology, or reproduction details only if you are comfortable sharing them.
    validations:
      required: false
