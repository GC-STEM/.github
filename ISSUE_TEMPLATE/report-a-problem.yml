name: Report a problem
description: Report incorrect, unclear, missing, or broken repository material.
title: "[Problem] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve these materials. Share what you know; you do not need to diagnose the cause.

        Public reports can be read by anyone. Leave out passwords, student records, private feedback, and completed coursework.

        For private help or if GitHub is difficult to use, contact your instructor through Brightspace. Use [private security reporting](https://github.com/GC-STEM/.github/blob/main/SECURITY.md) for suspected vulnerabilities or exposed information.

  - type: textarea
    id: location
    attributes:
      label: Where did you find the problem?
      description: Identify the file, heading, step, or page involved.
      placeholder: File, heading, step, or page...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened or was unclear?
      description: Describe what you were trying to do and the difficulty you encountered.
      placeholder: I was trying to... The problem was...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Optional. Tell us what you expected, if you know.
    validations:
      required: false

  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Optional. Include relevant error messages, steps, your operating system or application, and how the problem affects your work. Remove private information.
    validations:
      required: false
