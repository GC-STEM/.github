name: Request an improvement
description: Suggest a clearer, easier, or more useful repository experience.
title: "[Improvement] "
body:
  - type: markdown
    attributes:
      value: |
        Suggestions are welcome at any experience level. You do not need to provide a finished solution.

        Public requests can be read by anyone. Leave out student records, private feedback, credentials, and completed coursework.

        For grading questions, personal concerns, or a private suggestion, contact your instructor through Brightspace.

  - type: textarea
    id: improvement
    attributes:
      label: What would you improve?
      description: Describe the difficulty or the change you would find helpful.
      placeholder: It would be helpful if...
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Where would this improvement apply?
      description: Optional. Identify the file, instructions, tool, or activity.
    validations:
      required: false

  - type: textarea
    id: benefit
    attributes:
      label: How would this help?
      description: Optional. Explain who would benefit and how.
    validations:
      required: false
